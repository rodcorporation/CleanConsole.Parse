name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: 🛒 Checkout Code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 📦 Restore Dependencies
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: 🏷️ Set Version Variable
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        else
          echo "VERSION=1.0.0-preview-${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: 🎁 Pack (Generate .nupkg)
      run: |
        dotnet pack CleanConsole.Parse/CleanConsole.Parse.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkgs \
          -p:PackageVersion=${{ env.VERSION }}

    - name: ⬆️ Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkgs/*.nupkg

    - name: 🚀 Publish to NuGet.org
      # Só publica se for uma Release oficial, não em execuções manuais de teste
      if: github.event_name == 'release'
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json
